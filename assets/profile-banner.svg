<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">

  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"></stop>
      <stop offset="50%" stop-color="#0b1220"></stop>
      <stop offset="100%" stop-color="#101b2d"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"></stop>
      <stop offset="100%" stop-color="#7ee787"></stop>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>


  <!-- Background -->

  <rect width="1600" height="420" rx="24" fill="url(#background)"></rect>


  <!-- Background Network Lines -->

  <g opacity="0.12" stroke="#58a6ff" stroke-width="1">

    <path d="M1000 40 L1500 40"></path>
    <path d="M1050 80 L1500 80"></path>
    <path d="M1100 120 L1500 120"></path>
    <path d="M1150 160 L1500 160"></path>

    <path d="M1050 40 L1050 200"></path>
    <path d="M1120 40 L1120 200"></path>
    <path d="M1190 40 L1190 200"></path>
    <path d="M1260 40 L1260 200"></path>
    <path d="M1330 40 L1330 200"></path>
    <path d="M1400 40 L1400 200"></path>
    <path d="M1470 40 L1470 200"></path>

  </g>


  <!-- Decorative Curves -->

  <path d="
      M0 335
      C250 265
      400 385
      650 310
      S1100 220
      1600 295" fill="none" stroke="#1f6feb" stroke-width="2" opacity="0.20"></path>

  <path d="
      M0 360
      C280 290
      450 400
      700 325
      S1200 235
      1600 315" fill="none" stroke="#58a6ff" stroke-width="1" opacity="0.12"></path>


  <!-- Header -->

  <g transform="translate(80 65)">

    <circle cx="5" cy="5" r="5" fill="#58a6ff" filter="url(#glow)"></circle>

    <text x="25" y="12" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4">
      INFRASTRUCTURE • CLOUD • DEVOPS
    </text>


    <!-- Name -->

    <text x="0" y="92" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
      SUDHEESH K
    </text>


    <!-- Accent line -->

    <rect x="0" y="115" width="580" height="3" rx="2" fill="url(#accent)"></rect>


    <!-- Role -->

    <text x="0" y="165" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">
      Senior Infrastructure Lead
    </text>


    <!-- Technologies -->

    <text x="0" y="208" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="21">
      AWS • GCP • Kubernetes • Docker
    </text>

    <text x="0" y="243" fill="#c9d1d9" font-family="Arial, Helvetica, sans-serif" font-size="21">
      Terraform • CI/CD • GitOps • Automation
    </text>

  </g>


  <!-- Cloud / DevOps Pipeline -->

  <g transform="translate(1060 230)">

    <!-- AWS -->

    <rect x="0" y="0" width="125" height="70" rx="12" fill="#0d1626" stroke="#58a6ff" stroke-width="2"></rect>

    <text x="62" y="43" text-anchor="middle" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
      AWS
    </text>


    <!-- Connection -->

    <line x1="125" y1="35" x2="170" y2="35" stroke="#58a6ff" stroke-width="2"></line>


    <!-- GCP -->

    <rect x="170" y="0" width="125" height="70" rx="12" fill="#0d1626" stroke="#7ee787" stroke-width="2"></rect>

    <text x="232" y="43" text-anchor="middle" fill="#7ee787" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
      GCP
    </text>


    <!-- Connection -->

    <line x1="295" y1="35" x2="340" y2="35" stroke="#58a6ff" stroke-width="2"></line>


    <!-- Kubernetes -->

    <rect x="340" y="0" width="150" height="70" rx="12" fill="#0d1626" stroke="#58a6ff" stroke-width="2"></rect>

    <text x="415" y="43" text-anchor="middle" fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
      KUBERNETES
    </text>

  </g>


  <!-- Footer -->

  <text x="80" y="380" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3">
    BUILD • AUTOMATE • SECURE • MONITOR
  </text>

</svg>

    </text>


    <!-- GKE -->

    <rect x="840" y="320" width="160" height="90" rx="12" fill="#111d2e" stroke="#30363d"></rect>

    <text x="920" y="355" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18" font-weight="700">

      GKE

    </text>

    <text x="920" y="382" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="15">


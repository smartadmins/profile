  <!-- ========================= -->
  <!-- CLOUD → KUBERNETES -->
  <!-- ========================= -->

  <g stroke="url(#connection)" stroke-width="3" fill="none">

    <path d="M390 470 V525"></path>
    <path d="M1110 470 V525"></path>

  </g>


  <!-- ========================= -->
  <!-- KUBERNETES -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="220" y="525" width="1060" height="125" rx="18" fill="#0b1625" stroke="#58a6ff" stroke-width="2"></rect>


    <text x="750" y="560" text-anchor="middle" fill="#58a6ff" font-family="Arial" font-size="24" font-weight="700">


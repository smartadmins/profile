    </text>


    <!-- VPC -->

    <rect x="1040" y="320" width="160" height="90" rx="12" fill="#111d2e" stroke="#30363d"></rect>

    <text x="1120" y="355" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18" font-weight="700">

      VPC

    </text>

    <text x="1120" y="382" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="15">

      Networking

    </text>


    <!-- GAR -->

    <rect x="1240" y="320" width="140" height="90" rx="12" fill="#111d2e" stroke="#30363d"></rect>

    <text x="1310" y="355" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18" font-weight="700">

      GAR

    </text>

    <text x="1310" y="382" text-anchor="middle" fill="#8b949e" font-family="Arial" font-size="15">


<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720">

  <defs>

    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">

      <stop offset="0%" stop-color="#07101c"></stop>
      <stop offset="100%" stop-color="#101a2b"></stop>

    </linearGradient>


    <linearGradient id="connection" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="0%" stop-color="#58a6ff"></stop>
      <stop offset="100%" stop-color="#7ee787"></stop>

    </linearGradient>


    <filter id="shadow">

      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.28"></feDropShadow>

    </filter>

  </defs>


  <!-- Background -->

  <rect width="1500" height="720" rx="24" fill="url(#background)"></rect>


  <!-- Title -->

  <text x="750" y="50" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">

    CLOUD &amp; DEVOPS PLATFORM

  </text>


  <!-- ========================= -->
  <!-- SOURCE -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="60" y="90" width="270" height="100" rx="16" fill="#0d1626" stroke="#58a6ff" stroke-width="2"></rect>

    <text x="195" y="125" text-anchor="middle" fill="#58a6ff" font-family="Arial" font-size="20" font-weight="700">

      SOURCE

    </text>

    <text x="195" y="158" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18">

      GitHub • Git

    </text>

  </g>


  <!-- ========================= -->
  <!-- CI/CD -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="390" y="90" width="310" height="100" rx="16" fill="#0d1626" stroke="#7ee787" stroke-width="2"></rect>

    <text x="545" y="125" text-anchor="middle" fill="#7ee787" font-family="Arial" font-size="20" font-weight="700">

      CI / SECURITY

    </text>

    <text x="545" y="158" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18">

      GitHub Actions • Jenkins • Trivy

    </text>

  </g>


  <!-- ========================= -->
  <!-- REGISTRY -->
  <!-- ========================= -->

  <g filter="url(#shadow)">

    <rect x="760" y="90" width="310" height="100" rx="16" fill="#0d1626" stroke="#58a6ff" stroke-width="2"></rect>

    <text x="915" y="125" text-anchor="middle" fill="#58a6ff" font-family="Arial" font-size="20" font-weight="700">

      CONTAINER REGISTRY

    </text>

    <text x="915" y="158" text-anchor="middle" fill="#c9d1d9" font-family="Arial" font-size="18">

